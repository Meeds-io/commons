#############################################################################
#                       Digest mail notifications                          #
#############################################################################
# Text only, never HTML: the layout lives in the email template.
# {0} is the platform name, {1} the number of updates.
Notification.digest.subject.daily=Your daily recap on {0} – {1} updates
Notification.digest.subject.weekly=Your weekly recap on {0} – {1} updates
# {0} is the first name of the recipient
Notification.digest.greeting=Hi {0},
# {0} is the platform name (a link), {1} and {2} the first and last day of the week
Notification.digest.intro.daily=Here's what happened today on {0}:
Notification.digest.intro.weekly=Here's a summary of your week (from {1} to {2}) on {0}:
# {0} is how many more items the category holds
Notification.digest.more=+ {0} more →
Notification.digest.viewAll=View all on {0} →
Notification.digest.manage=Manage notification preferences →
